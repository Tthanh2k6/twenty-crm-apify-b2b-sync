[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twenty-crm-apify-b2b-sync"
version = "1.0.0"
description = "Idempotent async B2B lead enrichment sync engine that writes Apify Store Actor results into Twenty CRM through its REST API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Trung Thanh Tran", email = "ttrungthanh90@gmail.com" }
]
keywords = ["twenty-crm", "apify", "crm-sync", "b2b-enrichment", "etl", "webhook"]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
twenty-sync = "twenty_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
